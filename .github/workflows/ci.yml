name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned project and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests

      - name: Lint source and tests
        run: python -m ruff check lmiacsv tests

      - name: Verify tracked metadata and evidence
        run: python -m lmiacsv release-verify

      - name: Build Python distributions
        if: matrix.python-version == '3.14'
        run: python -m build

      - name: Verify distribution licensing and metadata
        if: matrix.python-version == '3.14'
        run: python -m lmiacsv release-verify --dist-dir dist
