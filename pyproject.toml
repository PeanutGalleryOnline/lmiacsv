[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmiacsv"
version = "0.1.0"
description = "Reproducible normalizer for Canada's public LMIA employer lists"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "DATA_LICENSES.md"]
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "ruff==0.14.7",
]

[project.scripts]
lmiacsv = "lmiacsv.cli:main"

[tool.setuptools.packages.find]
include = ["lmiacsv*"]

[tool.ruff]
line-length = 100
